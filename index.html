<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Hop - Arcade Flight</title>
    <meta
      name="description"
      content="Fly through the gates in Sky Hop, a tiny arcade game about impeccable timing."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="arcade-shell">
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Sky Hop home"><span class="brand-mark">S</span> SKY HOP<span class="wordmark-period">.</span></a>
        <p class="edition">ARCADE FLIGHT <span>NO. 001</span></p>
        <div class="toolbar">
          <button id="soundToggle" class="icon-button" type="button" aria-label="Mute sound" title="Mute sound">
            <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
          <button id="pauseButton" class="icon-button" type="button" aria-label="Pause game" title="Pause game" disabled>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
          </button>
        </div>
      </header>

      <section class="game-section" aria-label="Sky Hop game">
        <div class="game-heading">
          <div>
            <p class="eyebrow"><span class="live-dot"></span> ONE MORE FLIGHT</p>
            <h1>Find your <span>rhythm.</span></h1>
          </div>
          <div class="scoreboard" aria-label="Game scores">
            <div class="score-block"><span class="score-label">SCORE</span><strong id="score">00</strong></div>
            <div class="score-divider"></div>
            <div class="score-block best-score"><span class="score-label">BEST</span><strong id="bestScore">00</strong></div>
          </div>
        </div>

        <div class="game-frame">
          <canvas id="gameCanvas" width="800" height="520" aria-label="Sky Hop game. Press space or tap to fly through the gates."></canvas>
          <div id="gameOverlay" class="game-overlay" aria-live="polite">
            <div class="overlay-content">
              <p id="overlayKicker" class="overlay-kicker">THE SKY IS YOURS</p>
              <h2 id="overlayTitle">Ready,<br />little bird?</h2>
              <p id="overlayMessage" class="overlay-message">Thread the gates. Keep your wings.</p>
              <button id="startButton" class="start-button" type="button"><span>Start flying</span><span class="button-arrow" aria-hidden="true">↗</span></button>
            </div>
            <span class="overlay-index">SH / 001</span>
          </div>
          <div class="game-hint" aria-hidden="true"><span class="keycap">SPACE</span><span>or tap to flap</span></div>
        </div>

        <footer class="game-footer">
          <p>KEEP IT LIGHT <span>·</span> KEEP IT MOVING</p>
          <button id="restartButton" class="text-button" type="button" aria-label="Restart game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.6-2.1L20 12M4 12l2.9 5.1A7 7 0 0 0 18.5 15"/></svg><span>Restart</span></button>
        </footer>
      </section>

      <div id="announcement" class="visually-hidden" aria-live="polite"></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
